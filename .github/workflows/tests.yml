name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache downloaded PSGallery packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/PowerShellRepackager/*.nupkg
          key: psgallery-${{ hashFiles('tests/**/*.cs') }}
          restore-keys: psgallery-

      - name: PowerShell version
        shell: pwsh
        run: $PSVersionTable.PSVersion

      - name: Restore
        run: dotnet restore PowerShellRepackager.slnx

      - name: Build
        run: dotnet build PowerShellRepackager.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test PowerShellRepackager.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test results (${{ matrix.os }})
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: false
