name: Tests

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
  

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # - name: Cache downloaded PSGallery packages
      #   uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      #   with:
      #     path: ${{ runner.temp }}/PowerShellRepackager/*.nupkg
      #     key: psgallery-${{ hashFiles('tests/**/*.cs') }}
      #     restore-keys: psgallery-

      - name: PowerShell version
        shell: pwsh
        run: $PSVersionTable.PSVersion

      - name: Restore dotnet tools
        shell: pwsh
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore PowerShellRepackager.slnx

      - name: Build
        run: dotnet build PowerShellRepackager.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test PowerShellRepackager.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        with:
          name: Test results (${{ matrix.os }})
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: false

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dotnet tools
        shell: pwsh
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore PowerShellRepackager.slnx

      - name: Set module version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          Write-Host "Setting module version to $version"
          $manifestContent = Get-Content src/PowerShellRepackager/PowerShellRepackager.psd1
          $manifestContent = $manifestContent -replace 'ModuleVersion = ''\d+\.\d+\.\d+''', "ModuleVersion = '$version'"
          $manifestContent | Set-Content src/PowerShellRepackager/PowerShellRepackager.psd1

      - name: Build tagged version
        shell: pwsh
        run: dotnet build src/PowerShellRepackager --no-restore -c Release -p:Version=$("${{ github.ref_name }}".Substring(1)) -o ./dist/PowerShellRepackager/

      - name: 🧪 Import module
        shell: pwsh
        run: |
          Import-Module ./dist/PowerShellRepackager/PowerShellRepackager.psd1
          Get-Command -Module PowerShellRepackager

      - name: 📦 Publish PowerShellRepackager to PowerShell Gallery
        shell: pwsh
        run: |
          Import-Module ./dist/PowerShellRepackager/PowerShellRepackager.psd1
          Publish-Module -Path ./dist/PowerShellRepackager -NuGetApiKey $env:PSGALLERY_TOKEN -Repository PSGallery -Force
        env:
          PSGALLERY_TOKEN: ${{ secrets.PSGALLERY_TOKEN }}